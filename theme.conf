[General]
# KDE SDDM system settings reads/writes this lowercase key.
# The path is relative to the theme directory; the KCM may replace it
# with an absolute path in theme.conf.user after a wallpaper selection.
background=Assets/backgrounds/final_lab_background.png
type=image
color=#000000
# Three-joint entrance; disabling it shows the exact measured end pose immediately.
AnimationEnabled=true
AnimationDuration=3000
GreenColor=#66ff99
ShowUserPicture=true
# Native KDE SDDM option, overridable in theme.conf.user.
showClock=true
